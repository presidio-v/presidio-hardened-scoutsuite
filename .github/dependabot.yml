version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # codeql-action/init and codeql-action/analyze are distinct Dependabot
      # dependencies but ship from one repo, and analyze rejects a config file
      # written by a different version. Ungrouped, Dependabot bumps one and
      # leaves the other behind, which breaks the CodeQL job on every release.
      codeql-action:
        patterns: ["github/codeql-action*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
