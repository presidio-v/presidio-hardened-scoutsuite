name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build a CycloneDX SBOM of the full runtime tree
        run: |
          python -m venv /tmp/sbomenv
          . /tmp/sbomenv/bin/activate
          # Pin the generator so a future cyclonedx-py CLI change can't silently
          # break the SBOM step (the --outfile -> --output-file rename did exactly that).
          pip install --upgrade pip "cyclonedx-bom==7.3.0"
          # Install the pinned runtime tree (includes ScoutSuite) into the env.
          # Fail closed: the SBOM must describe the exact hash-verified tree.
          # --no-deps as in the image, CI and release gate: the lock is AWS-only
          # (ADR-0002), so ScoutSuite's declared non-AWS dependencies are absent.
          pip install --no-deps --require-hashes -r requirements.lock
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
