name: ScoutSuite upgrade

# Keep the pinned ScoutSuite current as a reviewed, fail-closed bump rather than
# manual drift. Runs the deterministic in-repo pin edits, regenerates the
# hash-pinned lockfile and the rule-name manifests, runs every gate, and opens a
# PR. Nothing merges automatically — a human reviews the diff and the green run.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "ScoutSuite version to upgrade to (blank = latest on PyPI)"
        required: false
        default: ""
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  propose-upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the upgrade branch
      pull-requests: write # open the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # requirements.lock is resolved for Python 3.11, the runtime image's version.
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.12"
      - name: Install tooling (wrapper only; no GPL ScoutSuite yet)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Determine target version
        id: target
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          current="$(presidio-scout-upgrade current)"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TARGET" ]; then
            target="$INPUT_TARGET"
          else
            target="$(python - <<'PY'
          import json, urllib.request
          url = "https://pypi.org/pypi/ScoutSuite/json"
          with urllib.request.urlopen(url, timeout=30) as r:  # nosec B310 (https)
              print(json.load(r)["info"]["version"])
          PY
          )"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ "$target" = "$current" ]; then
            echo "::notice::ScoutSuite already pinned to $current; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Proposing ScoutSuite $current -> $target"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply offline text pins
        if: steps.target.outputs.skip == 'false'
        run: presidio-scout-upgrade apply --to "${{ steps.target.outputs.target }}"

      - name: Regenerate the AWS-only hash-pinned requirements.lock
        # ADR-0002: requirements-aws.overrides drops the non-AWS provider SDKs.
        if: steps.target.outputs.skip == 'false'
        run: |
          uv pip compile pyproject.toml --extra scoutsuite \
            --override requirements-aws.overrides --generate-hashes \
            --python-version 3.11 --python-platform linux --output-file requirements.lock

      - name: Install the locked runtime, smoke-test it, regenerate rule manifests
        # runtime_smoke.py fails if the new ScoutSuite declares a dependency that is
        # neither in the lock nor in requirements-aws.overrides. A human then decides
        # which side it belongs on; nothing is opened until that is resolved.
        if: steps.target.outputs.skip == 'false'
        run: |
          pip install --no-deps --require-hashes -r requirements.lock
          pip install --no-deps -e .
          python scripts/runtime_smoke.py
          presidio-scout-validate --regenerate --source installed

      - name: Fail-closed gates (coherence, rulesets, tests)
        if: steps.target.outputs.skip == 'false'
        run: |
          presidio-scout-upgrade check
          presidio-scout-validate --source manifest
          presidio-scout-validate --source installed
          pip install -e ".[dev]"
          pytest -q

      - name: Open pull request
        if: steps.target.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.target.outputs.target }}
          CURRENT: ${{ steps.target.outputs.current }}
        run: |
          branch="scout-upgrade/${TARGET}"
          title="deps: bump ScoutSuite ${CURRENT} -> ${TARGET}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "$title"
          git push -f origin "$branch"
          if ! gh pr create --base main --head "$branch" --title "$title" --body \
            "Automated ScoutSuite upgrade ${CURRENT} → ${TARGET}.

          Performed by the upgrade workflow:
          - bumped the \`scoutsuite\` extra pin and the install-integrity constant
          - regenerated the AWS-only hash-pinned \`requirements.lock\` and passed the runtime smoke test
          - regenerated the rule-name manifests from the installed ScoutSuite
          - all fail-closed gates passed (pin coherence, ruleset validation, tests)

          Review the diff and the green CI run before merging."; then
            echo "::notice::PR for $branch may already exist; branch updated."
          fi
