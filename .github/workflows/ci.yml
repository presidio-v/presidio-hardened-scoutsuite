name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (wrapper + dev tools only; no GPL ScoutSuite)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Validate curated baselines reference known rule names
        run: presidio-scout-validate --source manifest
      - name: Test
        run: pytest --cov=presidio_scoutsuite --cov-report=term-missing --cov-fail-under=90

  pin-coherence:
    # The pinned ScoutSuite version is declared in several files that must agree
    # (the [scoutsuite] extra, requirements.lock, the install-integrity fallback
    # constant). Drift would let a gate silently check against the wrong version.
    # Fail-closed, offline — no GPL ScoutSuite needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install (wrapper only; no GPL ScoutSuite)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: ScoutSuite pin must be coherent across all pin sites
        run: presidio-scout-upgrade check

  lock-audit:
    # Blocking audit of the bundled runtime tree on every PR and push to main, so
    # a new advisory surfaces when it appears rather than at the next release.
    # Ignores exactly the IDs in requirements.lock.audit-exceptions (accepted
    # exceptions until their expiry, plus the documented runtime-track
    # blockers); release.yml ignores only the accepted ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Audit requirements.lock
        run: |
          python -m pip install --upgrade pip "pip-audit==2.10.0"
          today=$(date -u +%F)
          ignore=()
          while read -r id kind expires _; do
            case "$id" in ""|"#"*) continue ;; esac
            if [ "$kind" = accepted ] && [[ "$expires" < "$today" ]]; then
              echo "::error file=requirements.lock.audit-exceptions::$id expired on $expires"
              exit 1
            fi
            ignore+=(--ignore-vuln "$id")
          done < requirements.lock.audit-exceptions
          # --no-deps --disable-pip: the lock is the complete, hash-pinned runtime
          # set (ADR-0002). Resolving would follow ScoutSuite's metadata back to the
          # excluded Azure/GCP SDKs, which the runtime never installs.
          pip-audit -r requirements.lock --no-deps --disable-pip --progress-spinner off "${ignore[@]}"

  runtime-smoke:
    # Installs the bundled AWS-only runtime exactly as the image does and runs
    # scripts/runtime_smoke.py: every AWS provider module imports, the other
    # providers fail for lack of their SDKs, and ScoutSuite's declared
    # dependencies match requirements.lock plus requirements-aws.overrides.
    # Installs GPL ScoutSuite into a throwaway CI environment; nothing is shipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the locked runtime and the wrapper
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Runtime smoke test
        run: python scripts/runtime_smoke.py
      - name: Baselines must match the installed ScoutSuite rule inventory
        run: presidio-scout-validate --source installed

  lockfile:
    # Advisory in CI; the hash-pin requirement is *enforced* (hard fail) in
    # release.yml, where unpinned deps would actually be redistributed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Warn if requirements.lock is not hash-pinned
        run: |
          if ! grep -q -- '--hash=sha256:' requirements.lock; then
            echo "::warning file=requirements.lock::lockfile is not yet" \
                 "hash-pinned. Regenerate with pip-compile --generate-hashes" \
                 "before cutting a release (enforced in release.yml)."
          fi

  reproducible-build:
    # The wheel/sdist must be a deterministic function of the source: build
    # twice (in separate trees, with a fixed SOURCE_DATE_EPOCH) and require
    # byte-identical artifacts. A non-reproducible build defeats the point of
    # provenance — you couldn't independently rebuild and confirm what shipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build twice and compare artifact content
        run: |
          python -m pip install --upgrade pip build
          # Pin the build clock so file mtimes embedded in the archives are stable.
          export SOURCE_DATE_EPOCH=1700000000
          # Build into dirs OUTSIDE the checkout: hatchling's sdist sweeps in
          # untracked files, so an in-tree outdir would make the 2nd build ingest
          # the 1st build's artifacts and spuriously "differ".
          dist1="$(mktemp -d)"; dist2="$(mktemp -d)"
          python -m build --outdir "$dist1" .
          python -m build --outdir "$dist2" .
          # Wheels are zip archives normalized under SOURCE_DATE_EPOCH — compare
          # bytes directly. Sdists are gzip-wrapped, and the gzip *container*
          # carries an mtime that is not part of the archived content; per
          # reproducible-builds.org we compare the decompressed tar so the check
          # asserts true content reproducibility, not gzip-header determinism.
          digest() {
            sha256sum "$1"/*.whl | awk '{print "whl " $1}'
            for s in "$1"/*.tar.gz; do
              gzip -dc "$s" | sha256sum | awk '{print "sdist " $1}'
            done
          }
          a=$(digest "$dist1"); b=$(digest "$dist2")
          printf 'build 1:\n%s\nbuild 2:\n%s\n' "$a" "$b"
          if [ "$a" != "$b" ]; then
            echo "::error::build is not reproducible — artifact content differs"
            diff <(echo "$a") <(echo "$b") || true
            exit 1
          fi
          echo "reproducible: identical wheel bytes and sdist content across two builds"
